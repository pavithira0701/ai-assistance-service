
name: Spring Boot CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  # CI: Build, test and publish Docker image
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test Spring Boot application
        run: mvn -B clean verify

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  # CD: Deploy application to EC2
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

            docker stop ai-assistance-service || true
            docker rm ai-assistance-service || true

            docker run -d \
              --name ai-assistance-service \
              -p 8084:8084 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

            echo "Deployment completed"
            
            for i in $(seq 1 30); do
              if curl -sS -o /dev/null http://localhost:8084; then
                echo "Application is responding"
                exit 0
              fi
              sleep 2
            done

            echo "Application did not respond"
            docker logs ai-assistance-service
            exit 1
